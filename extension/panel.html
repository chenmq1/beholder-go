<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font: 12px/1.5 Consolas, 'Segoe UI', sans-serif; margin: 0; color: #d4d4d4; background: #1e1e1e; }
    #toolbar { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #2d2d2d; border-bottom: 1px solid #3c3c3c; position: sticky; top: 0; z-index: 2; }
    #backend { color: #9cdcfe; }
    #count { color: #808080; }
    #status { color: #6a9955; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
    #status.err { color: #f48771; }
    button { background: #0e639c; color: #fff; border: none; padding: 3px 10px; cursor: pointer; border-radius: 2px; }
    button:hover { background: #1177bb; }
    button:disabled { background: #3c3c3c; color: #808080; cursor: default; }
    label.chk { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #cccccc; }
    table { width: 100%; border-collapse: collapse; }
    th { position: sticky; top: 33px; background: #252526; text-align: left; padding: 3px 8px; border-bottom: 1px solid #3c3c3c; font-weight: normal; color: #9cdcfe; }
    td { padding: 3px 8px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
    tr:hover td { background: #2a2d2e; }
    .url { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .method { color: #ce9178; min-width: 44px; }
    .st-ok { color: #6a9955; } .st-err { color: #f48771; } .st-redir { color: #dcdcaa; }
    .tag { font-size: 10px; padding: 0 5px; border-radius: 8px; margin-left: 4px; }
    .tag.auto { background: #4b3a10; color: #dcdcaa; border: 1px solid #665020; }
    .tag.ok { background: #0f3a1f; color: #6a9955; border: 1px solid #1d5c33; }
    .tag.fail { background: #3a0f0f; color: #f48771; border: 1px solid #5c1d1d; }
    .sendbtn { padding: 1px 8px; font-size: 11px; }
    #empty { color: #808080; padding: 20px; }
    a { color: #9cdcfe; }
    #hint { padding: 6px 10px; color: #808080; border-bottom: 1px solid #3c3c3c; display: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span>后端：<span id="backend">-</span></span>
    <label class="chk"><input type="checkbox" id="autosend"> 匹配规则自动发送</label>
    <button id="clear">清空</button>
    <span id="count">0 条</span>
    <span id="status"></span>
  </div>
  <div id="hint">规则（URL 正则等）在扩展弹窗中配置；勾选“匹配规则自动发送”后，符合条件的请求会自动取响应体并上报。</div>
  <table>
    <thead>
      <tr><th>状态</th><th>方法</th><th>URL</th><th>类型</th><th>大小</th><th>操作</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty">尚未捕获请求。打开任意网页并等待网络请求，或刷新页面。</div>
  <script src="settings.js"></script>
  <script src="panel.js"></script>
</body>
</html>
