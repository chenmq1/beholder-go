<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扩展捕获 · Trace 视图</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
            margin: 0; padding: 24px; background: #f5f7fa; color: #1f2d3d;
        }
        h1 { font-size: 20px; margin: 0 0 16px; }
        .card {
            background: #fff; border-radius: 8px; padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 20px;
        }
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field.grow { flex: 1; min-width: 320px; }
        label { font-size: 12px; color: #606266; }
        input, select {
            border: 1px solid #dcdfe6; border-radius: 4px; padding: 8px 10px;
            font-size: 14px; outline: none; background: #fff;
        }
        input:focus, select:focus { border-color: #409eff; }
        button {
            background: #409eff; color: #fff; border: none; border-radius: 4px;
            padding: 9px 20px; font-size: 14px; cursor: pointer; height: 36px;
        }
        button:hover { background: #66b1ff; }
        button:disabled { background: #a0cfff; cursor: not-allowed; }
        .hint { font-size: 12px; color: #909399; margin-top: 4px; }
        .meta { font-size: 13px; color: #606266; margin-bottom: 12px; line-height: 1.7; }
        .meta b { color: #1f2d3d; }
        .meta .kv { display: inline-block; margin-right: 18px; }
        .status { padding: 24px; text-align: center; color: #909399; font-size: 14px; }
        .error { color: #f56c6c; }
        nav.top { background: #1f2d3d; padding: 0 24px; margin: -24px -24px 20px; height: 48px;
            display: flex; align-items: center; gap: 8px; }
        nav.top a { color: #c0c4cc; text-decoration: none; padding: 6px 14px; border-radius: 4px;
            font-size: 14px; }
        nav.top a:hover { background: rgba(255,255,255,.1); color: #fff; }
        nav.top a.active { background: #409eff; color: #fff; }

        /* trace 专用 */
        .trace-view { font-family: ui-monospace, Consolas, "Microsoft YaHei", monospace; font-size: 13px; }
        .node {
            border-left: 2px solid #e4e7ed; padding: 8px 10px; margin: 4px 0;
            background: #fafbfc; border-radius: 0 4px 4px 0;
        }
        .node:hover { background: #f0f5ff; }
        .node.revert-node { border-left-color: #f56c6c; background: #fef0f0; }
        .node-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .depth-badge {
            display: inline-block; min-width: 44px; text-align: center;
            background: #e4e7ed; color: #606266; border-radius: 3px;
            font-size: 11px; padding: 2px 6px;
        }
        .tag {
            display: inline-block; font-size: 11px; font-weight: 600;
            padding: 2px 7px; border-radius: 3px; letter-spacing: .3px;
        }
        .tag-call { background: #ecf5ff; color: #409eff; border: 1px solid #d9ecff; }
        .tag-store { background: #fdf6ec; color: #e6a23c; border: 1px solid #faecd8; }
        .tag-other { background: #f4f4f5; color: #909399; border: 1px solid #e9e9eb; }
        .op { color: #67c23a; font-weight: 600; }
        .addr { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: #1f2d3d; }
        .addr.muted { color: #909399; }
        .arrow { color: #c0c4cc; }
        .addr-label { font-family: inherit; font-weight: 500; color: #1f2d3d; }
        .addr-label.labeled { background: #e8f4ff; border: 1px solid #b3d8ff; border-radius: 3px;
            padding: 1px 5px; font-weight: 700; color: #1d6fdb; }
        .ext-link { color: #409eff; text-decoration: none; font-size: 11px; margin-left: 6px; }
        .ext-link:hover { text-decoration: underline; }
        /* 已验证代码状态链接（scan 与 de 之间） */
        .verify-link {
            display: inline-block; font-size: 11px; margin-left: 6px; padding: 1px 6px;
            border-radius: 3px; border: 1px solid transparent; letter-spacing: .3px;
        }
        .verify-link.pending { color: #909399; background: #f4f4f5; border-color: #e9e9eb; cursor: default; }
        .verify-link.verified { color: #fff; background: #67c23a; border-color: #67c23a;
            font-weight: 600; cursor: pointer; }
        .verify-link.verified:hover { background: #85ce61; border-color: #85ce61; }
        .verify-link.unverified { color: #b8860b; background: #fdf6ec; border-color: #faecd8;
            font-weight: 600; cursor: default; }
        .verify-link.failed { color: #f56c6c; background: #fef0f0; border-color: #fbc4c4;
            cursor: default; }

        /* 已验证代码弹窗 */
        .code-modal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.55);
            display: flex; align-items: center; justify-content: center; padding: 24px; }
        .code-modal-box { display: flex; flex-direction: column; width: 96vw; height: 92vh;
            background: #fff; border-radius: 8px; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,.3); }
        .code-modal-head { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
            border-bottom: 1px solid #ebeef5; flex: 0 0 auto; }
        .code-modal-title { font-weight: 700; font-size: 14px; color: #1f2d3d; white-space: nowrap; }
        .code-modal-sub { flex: 1; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
            color: #909399; word-break: break-all; }
        .code-modal-actions button { border: 1px solid #dcdfe6; background: #fff; color: #606266;
            border-radius: 4px; padding: 4px 12px; font-size: 12px; cursor: pointer; margin-left: 8px; }
        .code-modal-actions button:hover { color: #409eff; border-color: #b3d8ff; }
        .code-modal-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 16px 0;
            background: #f5f7fa; border-bottom: 1px solid #ebeef5; flex: 0 0 auto;
            max-height: 96px; overflow-y: auto; }
        .code-modal-tabs .file-tab { border: 1px solid #dcdfe6; border-bottom: none; background: #fff;
            padding: 5px 12px; font-size: 12px; cursor: pointer; color: #606266;
            border-radius: 4px 4px 0 0; }
        .code-modal-tabs .file-tab.active { background: #2d2d2d; color: #fff; border-color: #2d2d2d; }
        .code-modal-body { flex: 1 1 auto; overflow: auto; background: #2d2d2d; }
        .code-modal-body pre { margin: 0; padding: 16px; }
        .code-modal-body code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
            line-height: 1.55; color: #ccc; white-space: pre; tab-size: 4; }
        .tok-kw { color: #cc99cd; }
        .tok-str { color: #7ec699; }
        .tok-com { color: #999; font-style: italic; }
        .tok-num { color: #f08d49; }
        .sel { color: #9254de; font-size: 12px; }
        .gas { color: #606266; font-size: 12px; }
        .revert-badge { background: #f56c6c; color: #fff; font-size: 11px; font-weight: 700;
            padding: 2px 7px; border-radius: 3px; }
        .value-tag { color: #e6a23c; font-size: 12px; }
        details.node-detail { margin-top: 6px; }
        details.node-detail > summary {
            cursor: pointer; font-size: 12px; color: #606266; user-select: none;
            padding: 2px 0;
        }
        details.node-detail > summary:hover { color: #409eff; }
        .args { margin: 6px 0 6px 16px; }
        .arg { display: grid; grid-template-columns: 140px 90px 1fr; gap: 8px;
            padding: 3px 0; border-bottom: 1px dashed #ebeef5; font-size: 12px; }
        .arg:last-child { border-bottom: none; }
        .arg .arg-name { color: #1f2d3d; }
        .arg .arg-type { color: #909399; }
        .arg .arg-val { color: #1f2d3d; word-break: break-all; }
        pre.raw-body {
            margin: 0; padding: 12px; background: #1f2d3d; color: #c0c4cc;
            border-radius: 4px; font-size: 12px; overflow: auto; max-height: 70vh;
            white-space: pre-wrap; word-break: break-all;
        }
        .truncated-warn { color: #e6a23c; font-size: 12px; margin-bottom: 8px; }

        /* 孤立 Sync 分析结果 */
        .sol-card {
            border: 1px solid #b3d8ff; border-radius: 8px; padding: 12px 14px;
            margin-bottom: 10px; background: #f5faff;
        }
        .sol-title { font-weight: 700; color: #1d6fdb; margin-bottom: 8px; font-size: 13px; }
        .sol-row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0;
            font-size: 13px; flex-wrap: wrap; }
        .sol-row .k { color: #606266; min-width: 104px; flex: 0 0 104px; }
        .sol-locate { color: #409eff; cursor: pointer; font-size: 11px; text-decoration: underline; }
        .sol-next { color: #909399; font-size: 12px; }
        .sol-none { padding: 10px 14px; background: #f0f9eb; border: 1px solid #c2e7b0;
            border-radius: 8px; color: #529b2e; font-size: 13px; }
        .node.locate-flash { box-shadow: 0 0 0 2px #e6a23c; background: #fdf6ec !important;
            transition: box-shadow .2s; }
        .taint-badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; margin-left: 6px; }
        .taint-badge.hit { background: #e1f3d8; color: #529b2e; border: 1px solid #b3e19d; }
        .taint-badge.miss { background: #fef0f0; color: #f56c6c; border: 1px solid #fbc4c4; }
        .taint-token { font-size: 11px; color: #67c23a; margin-left: 6px; }
        .taint-token.sel { color: #e6a23c; }
    </style>
</head>
<body>
    <nav class="top" data-active="/capture-view"></nav>
    <script src="/web/nav.js"></script>
    <h1>扩展捕获 · Trace 视图</h1>

    <div class="card">
        <div class="form-row">
            <div class="field grow">
                <label>选择 capture（默认最近一条）</label>
                <select id="capSelect" onchange="loadCapture()"></select>
            </div>
            <div class="field">
                <button id="refreshBtn" onclick="refreshList()">刷新列表</button>
            </div>
            <div class="field">
                <button id="reloadBtn" onclick="loadCapture()">重新渲染</button>
            </div>
            <div class="field">
                <button id="solidaryBtn" onclick="runSolidary()">查找孤立 Sync</button>
            </div>
            <div class="field">
                <button id="taintBtn" onclick="runTaint()">查找用户输入</button>
            </div>
            <div class="field">
                <label>链（地址外链用）</label>
                <select id="chainId" onchange="loadCapture()">
                    <option value="1">1 · Ethereum</option>
                    <option value="56">56 · BSC</option>
                    <option value="137">137 · Polygon</option>
                    <option value="42161">42161 · Arbitrum</option>
                    <option value="8453">8453 · Base</option>
                    <option value="10">10 · Optimism</option>
                </select>
            </div>
        </div>
        <div class="hint">数据来自浏览器扩展上报（内存环形缓存最近 50 条，不入库）。响应体为 JSON 且含 nodeInfos 时按调用链推导深度缩进展示；否则按原始文本显示。</div>
    </div>

    <div class="card">
        <div id="solidaryPanel" style="display:none; margin-bottom:16px;"></div>
        <div id="taintPanel" style="display:none; margin-bottom:16px;"></div>
        <div id="meta" class="meta" style="display:none;"></div>
        <div id="status" class="status">点击“刷新列表”加载最近 capture</div>
        <div id="traceView" class="trace-view" style="display:none;"></div>
    </div>

    <!-- 已验证代码弹窗（直接 caller 地址的 verified 链接点击打开） -->
    <div id="codeModal" class="code-modal" style="display:none;">
        <div class="code-modal-box">
            <div class="code-modal-head">
                <span class="code-modal-title">已验证代码</span>
                <span class="code-modal-sub" id="codeModalSub"></span>
                <span class="code-modal-actions">
                    <button type="button" id="codeCopyBtn">复制当前文件</button>
                    <button type="button" id="codeCloseBtn">关闭</button>
                </span>
            </div>
            <div class="code-modal-tabs" id="codeModalTabs"></div>
            <div class="code-modal-body"><pre><code id="codeModalCode"></code></pre></div>
        </div>
    </div>

<script src="/web/solidary_sync.js"></script>
<script src="/web/user_input_taint.js"></script>
<script>
    const API_LIST = "/api/extension/captures";

    // 链配置：dedaub 子路径参照 config/chains.go dedaubChainStrs；scan 域名按链对应
    const explorerByChain = {
        1:    "https://etherscan.io",
        56:   "https://bscscan.com",
        137:  "https://polygonscan.com",
        42161: "https://arbiscan.io",
        8453: "https://basescan.org",
        10:   "https://optimistic.etherscan.io"
    };
    const dedaubByChain = {
        1: "ethereum", 56: "binance", 137: "polygon",
        42161: "arbitrum", 8453: "base", 10: "optimism"
    };
    function currentChainId() { return Number(document.getElementById("chainId").value) || 1; }

    // addrLinks 在地址后挂 scan + dedaub 两个外链（地址格式 0x+40hex 才处理）
    // 有 label 时显示 label（hover 显示地址），链接仍用原地址
    // verify 为 true 时在 scan 与 de 之间插入「已验证代码」状态链接（由 checkVerifiedLinks 异步填充）
    function addrLinks(addr, labelMap, verify) {
        labelMap = labelMap || new Map();
        if (!addr || !/^0x[0-9a-fA-F]{40}$/.test(addr)) return esc(addr);
        const cid = currentChainId();
        const exp = explorerByChain[cid] || explorerByChain[1];
        const dd = dedaubByChain[cid] || "ethereum";
        const expHref = `${exp}/address/${addr}#code`;
        const dedHref = `https://app.dedaub.com/${dd}/address/${addr}/decompiled`;
        const label = labelMap.get(String(addr).toLowerCase()) || "";
        const display = label ? esc(label) : esc(addr);
        const title = label ? ` title="${esc(addr)}"` : "";
        const cls = label ? "addr-label labeled" : "addr-label";
        const verifyHtml = verify
            ? `<span class="verify-link pending" data-addr="${esc(addr)}" title="检查 Etherscan 已验证代码">…</span>`
            : "";
        return `<span class="${cls}"${title}>${display}</span> <a class="ext-link" href="${expHref}" target="_blank" rel="noopener noreferrer" title="${expHref}">scan</a>${verifyHtml}<a class="ext-link" href="${dedHref}" target="_blank" rel="noopener noreferrer" title="${dedHref}">de</a>`;
    }

    function shortAddr(addr) {
        if (!addr) return "";
        if (addr.length <= 14) return addr;
        return addr.slice(0, 8) + "..." + addr.slice(-6);
    }
    function shortHex(h) {
        if (!h) return "";
        if (h.length <= 16) return h;
        return h.slice(0, 10) + "..." + h.slice(-6);
    }
    function esc(s) {
        if (s === null || s === undefined) return "";
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // fmtVal 格式化参数值：纯大整数加千分位，其余原样
    function fmtVal(v) {
        if (v === null || v === undefined) return "";
        const s = String(v);
        if (/^-?\d+$/.test(s) && s.length > 3) {
            try { return BigInt(s).toLocaleString("en-US"); } catch (e) { return s; }
        }
        return s;
    }

    // renderSig 把 decoded 渲染成 funcName(name=val, name=val)
    function renderSig(decoded) {
        const sig = decoded.signature || "";
        const name = decoded.name || (sig ? sig.replace(/\(.*$/, "") : "");
        const args = Array.isArray(decoded.argsIn) ? decoded.argsIn
                   : Array.isArray(decoded.args) ? decoded.args : [];
        if (!args.length) return esc(sig || name);
        const parts = args.map(a => {
            const an = a.name || a.type || "";
            return `${esc(an)}=${esc(fmtVal(a.value))}`;
        });
        return `${esc(name)}(${parts.join(", ")})`;
    }

    // decodeBody 处理 base64 编码响应体，返回明文
    function decodeBody(body, enc) {
        if (!body) return "";
        if (enc === "base64") {
            try { return atob(body); } catch (e) { return body; }
        }
        return body;
    }

    // tryParseTrace 尝试解析为含 nodeInfos 的 trace JSON
    function tryParseTrace(text) {
        if (!text) return null;
        let obj;
        try { obj = JSON.parse(text); } catch (e) { return null; }
        if (!obj || !Array.isArray(obj.nodeInfos) || obj.nodeInfos.length === 0) return null;
        return obj;
    }

    // 推导调用链深度：按 trace.trace 的 children 树逐层 +1（id 全局唯一，避免同地址多次调用串扰）
    // 隐藏节点（nodeType 3/4）不占层级；树中不存在的节点深度直接记为 0，不做兜底
    function deriveDepths(trace, nodes) {
        const visibleIds = new Set(nodes.map(n => String(n.id)));
        const depthById = new Map();
        (function walk(list, parentDepth) {
            for (const t of (list || [])) {
                const id = String(t.id);
                const visible = visibleIds.has(id);
                const d = visible ? parentDepth + 1 : parentDepth;
                if (visible) depthById.set(id, d);
                walk(t.children || [], d);
            }
        })((trace && trace.trace) || [], -1); // 起始 -1：顶层可见节点 depth 为 0
        return nodes.map((node, index) => {
            const id = String(node.id);
            return {
                node,
                nd: node.nodeData || {},
                depth: depthById.has(id) ? depthById.get(id) : 0,
                index
            };
        });
    }

    function argRow(a, labelMap) {
        if (!a) return "";
        const name = a.name || "";
        const type = a.type || "";
        const val = a.value;
        let valHtml;
        if (val === null || val === undefined) {
            valHtml = '<span class="arg-val muted">—</span>';
        } else if (typeof val === "string" && val.length > 80) {
            // 长值（如 calldata bytes）折叠
            valHtml = `<details><summary class="arg-val" style="color:#409eff;cursor:pointer;">${esc(val.slice(0, 78))}… (${val.length} chars)</summary><pre class="arg-val" style="margin:4px 0 0 0;white-space:pre-wrap;word-break:break-all;">${esc(val)}</pre></details>`;
        } else if (typeof val === "string" && /^0x[0-9a-fA-F]{40}$/.test(val)) {
            valHtml = `<span class="arg-val">${addrLinks(val, labelMap)}</span>`;
        } else {
            valHtml = `<span class="arg-val">${esc(val)}</span>`;
        }
        return `<div class="arg"><span class="arg-name">${esc(name)}</span><span class="arg-type">${esc(type)}</span>${valHtml}</div>`;
    }

    function renderArgsList(args, title, labelMap) {
        if (!args || !args.length) return "";
        return `<div class="args"><div style="font-size:11px;color:#909399;margin-bottom:2px;">${title}</div>${args.map(a => argRow(a, labelMap)).join("")}</div>`;
    }

    function renderNode(item, labelMap) {
        const { node, nd, depth, index } = item;
        const indent = depth * 22;
        const op = nd.operation || "";
        const callee = nd.callee || nd.contract || "";
        const selector = nd.selector || "";
        const decoded = nd.decoded || {};
        const sig = decoded.signature || decoded.name || "";
        const sigText = sig ? renderSig(decoded) : "";
        const gas = (nd.gasUsed !== undefined && nd.gasUsed !== null) ? Number(nd.gasUsed).toLocaleString() + " gas" : "";
        const value = nd.value || "";
        const revert = nd.revert === true;
        const revertMsg = nd.revertMsg || "";

        const slotVal = nd.value && node.nodeType === 3 ? nd.value : "";

        // 摘要行：op → 地址(完整) → selector → value → gas → REVERT
        let summary = `<div class="node-summary">`;
        if (op) summary += `<span class="op">${esc(op)}</span>`;
        if (callee) summary += `<span class="addr">${addrLinks(callee, labelMap)}</span>`;
        if (sigText) summary += `<span style="color:#9254de;font-weight:600;" title="selector ${esc(selector)}">${sigText}</span>`;
        else if (selector) summary += `<span class="sel" title="selector">${esc(selector)}</span>`;
        if (value && node.nodeType !== 3) summary += `<span class="value-tag" title="msg.value">${esc(value)}</span>`;
        if (gas) summary += `<span class="gas">${gas}</span>`;
        if (revert) summary += `<span class="revert-badge" title="${esc(revertMsg)}">REVERT</span>`;
        summary += `</div>`;

        // 详情（decoded 参数 / output / calldata / 存储值）
        let detailHtml = "";
        const argsIn = renderArgsList(decoded.argsIn || decoded.args, decoded.args ? "args" : "argsIn", labelMap);
        const argsOut = renderArgsList(decoded.argsOut, "argsOut", labelMap);
        const hasDetail = argsIn || argsOut || nd.calldata || nd.output || (node.nodeType === 3 && slotVal) || revertMsg;
        if (hasDetail) {
            let inner = "";
            if (argsIn) inner += argsIn;
            if (argsOut) inner += argsOut;
            if (nd.calldata) inner += `<div class="arg"><span class="arg-name">calldata</span><span class="arg-type">bytes</span><details><summary class="arg-val" style="color:#409eff;cursor:pointer;">${esc(shortHex(nd.calldata))} (${nd.calldata.length} chars)</summary><pre class="arg-val" style="margin:4px 0 0 0;white-space:pre-wrap;word-break:break-all;">${esc(nd.calldata)}</pre></details></div>`;
            if (nd.output) inner += `<div class="arg"><span class="arg-name">output</span><span class="arg-type">bytes</span><details><summary class="arg-val" style="color:#409eff;cursor:pointer;">${esc(shortHex(nd.output))} (${nd.output.length} chars)</summary><pre class="arg-val" style="margin:4px 0 0 0;white-space:pre-wrap;word-break:break-all;">${esc(nd.output)}</pre></details></div>`;
            if (node.nodeType === 3 && slotVal) inner += `<div class="arg"><span class="arg-name">value</span><span class="arg-type">bytes32</span><span class="arg-val">${esc(slotVal)}</span></div>`;
            if (revertMsg) inner += `<div class="arg"><span class="arg-name">revertMsg</span><span class="arg-type">string</span><span class="arg-val" style="color:#f56c6c;">${esc(revertMsg)}</span></div>`;
            detailHtml = `<details class="node-detail"><summary>展开详情（decoded / calldata / output）</summary>${inner}</details>`;
        }

        const cls = revert ? "node revert-node" : "node";
        return `<div class="${cls}" id="tn-${node.nodeType}-${node.id}" style="margin-left:${indent}px;">${summary}${detailHtml}</div>`;
    }

    function renderTrace(text, labels) {
        const trace = tryParseTrace(text);
        if (!trace) {
            // 非 trace JSON：原始文本
            return `<pre class="raw-body">${esc(text)}</pre>`;
        }
        // 地址 → label 映射（key 小写，便于大小写不敏感匹配）
        const labelMap = new Map();
        if (Array.isArray(labels)) {
            labels.forEach(l => { if (l && l.address) labelMap.set(String(l.address).toLowerCase(), l.label || ""); });
        }
        // 忽略 nodeType=3（存储读写）和 nodeType=4 的节点，不参与渲染与深度推导
        const visible = trace.nodeInfos.filter(n => n.nodeType !== 3 && n.nodeType !== 4);
        const items = deriveDepths(trace, visible);
        const head = `<div class="hint" style="margin-bottom:8px;">trace · 共 <b>${items.length}</b> 个节点（已忽略 nodeType 3/4）· 按 trace.trace 的 children 树推导深度缩进</div>`;
        return head + items.map(it => renderNode(it, labelMap)).join("");
    }

    // ===== 孤立 Sync 分析逻辑见 solidary_sync.js =====
    // 从 trace 树构建 id -> 父树节点 id
    function buildParentMap(trace) {
        const parentOf = new Map();
        (function build(nodes) {
            for (const t of nodes) {
                for (const ch of (t.children || [])) parentOf.set(ch.id, t.id);
                build(t.children || []);
            }
        })(trace.trace || []);
        return parentOf;
    }

    // 沿树向上取事件所在调用帧与直接 caller 的逻辑见 solidary_sync.js（enclosingFrames）

    function frameSigHtml(frame) {
        const dec = (frame.nodeData && frame.nodeData.decoded) || {};
        if (dec.signature || dec.name) return renderSig(dec);
        const sel = (frame.nodeData && frame.nodeData.selector) || "";
        return sel ? esc(sel) : "(未解码调用)";
    }

    function locateLink(nodeType, id) {
        return `<span class="sol-locate" onclick="locateNode(${nodeType}, ${id})">定位</span>`;
    }

    function locateNode(nodeType, id) {
        const el = document.getElementById(`tn-${nodeType}-${id}`);
        if (!el) return;
        el.scrollIntoView({ behavior: "smooth", block: "center" });
        el.classList.add("locate-flash");
        setTimeout(() => el.classList.remove("locate-flash"), 2200);
    }

    // ===== 直接 caller 地址的已验证代码检查 =====
    // 仅对 addrLinks(addr, labelMap, true) 生成的 .verify-link 生效：
    // 调后端 /api/contract/verified 取 Etherscan 验证代码（命中即落库），
    // 成功 → 绿色 verified 可点击查看；未验证 → 黄色 unverified 不可点；失败 → failed
    const VERIFY_API = "/api/contract/verified";
    const verifiedCodeCache = new Map(); // `${chainId}:${addrLower}` -> {status, code, filename, message}

    async function checkVerifiedLinks(root) {
        const scope = root || document;
        const els = Array.from(scope.querySelectorAll(".verify-link[data-addr]"))
            .filter(el => el.classList.contains("pending"));
        if (!els.length) return;
        const chainId = currentChainId();
        // 相同地址只请求一次
        const byAddr = new Map();
        els.forEach(el => {
            const addr = String(el.getAttribute("data-addr") || "").toLowerCase();
            if (!addr) return;
            if (!byAddr.has(addr)) byAddr.set(addr, []);
            byAddr.get(addr).push(el);
        });
        await Promise.all(Array.from(byAddr.entries()).map(async ([addr, list]) => {
            const key = `${chainId}:${addr}`;
            let data = verifiedCodeCache.get(key);
            if (!data) {
                try {
                    const resp = await fetch(`${VERIFY_API}?address=${encodeURIComponent(addr)}&chainId=${chainId}`);
                    data = await resp.json();
                    if (!data || !data.status) data = { status: "failed", message: `HTTP ${resp.status}` };
                } catch (err) {
                    data = { status: "failed", message: err.message };
                }
                verifiedCodeCache.set(key, data);
            }
            list.forEach(el => applyVerifyState(el, chainId, addr, data));
        }));
    }

    function applyVerifyState(el, chainId, addr, data) {
        const status = String((data && data.status) || "failed");
        el.classList.remove("pending", "verified", "unverified", "failed");
        el.onclick = null;
        if (status === "verified") {
            el.classList.add("verified");
            el.textContent = "verified";
            el.title = "点击查看已验证代码";
            el.onclick = () => showVerifiedCode(addr, chainId);
        } else if (status === "unverified") {
            el.classList.add("unverified");
            el.textContent = "unverified";
            el.title = "Etherscan 无已验证代码";
        } else {
            el.classList.add("failed");
            el.textContent = "failed";
            el.title = (data && data.message) ? String(data.message) : "获取已验证代码失败";
        }
    }

    // ===== 已验证代码弹窗 =====
    let modalFiles = [];
    let modalActive = 0;

    function showVerifiedCode(addr, chainId) {
        const data = verifiedCodeCache.get(`${chainId}:${String(addr).toLowerCase()}`);
        if (!data || data.status !== "verified") return;
        const files = parseVerifiedSources(data.code || "");
        const sub = `${addr} · chainId ${chainId}${data.filename ? " · " + data.filename : ""}`;
        openCodeModal(sub, files);
    }

    // parseVerifiedSources 解析 Etherscan SourceCode：
    // 支持 {{...}} 多文件标准 JSON（sources→{content}）、单 {} JSON、纯代码三种形态
    function parseVerifiedSources(code) {
        const raw = String(code || "");
        const trimmed = raw.trim();
        let json = null;
        try {
            if (trimmed.startsWith("{{") && trimmed.endsWith("}}")) json = JSON.parse(trimmed.slice(1, -1));
            else if (trimmed.startsWith("{") && trimmed.endsWith("}")) json = JSON.parse(trimmed);
        } catch (e) { json = null; }
        if (json && json.sources && typeof json.sources === "object") json = json.sources;
        if (json && typeof json === "object") {
            const files = Object.keys(json)
                .filter(k => json[k] && typeof json[k].content === "string")
                .map(k => ({ name: k, content: json[k].content }));
            if (files.length) return files;
        }
        return [{ name: "verified source", content: raw }];
    }

    function openCodeModal(sub, files) {
        modalFiles = (files && files.length) ? files : [{ name: "verified source", content: "" }];
        modalActive = 0;
        document.getElementById("codeModalSub").textContent = sub || "";
        const tabs = document.getElementById("codeModalTabs");
        tabs.innerHTML = modalFiles.length > 1
            ? modalFiles.map((f, i) =>
                `<span class="file-tab${i === 0 ? " active" : ""}" data-idx="${i}">${esc(f.name)}</span>`).join("")
            : "";
        tabs.querySelectorAll(".file-tab").forEach(el => {
            el.onclick = () => {
                modalActive = Number(el.getAttribute("data-idx")) || 0;
                tabs.querySelectorAll(".file-tab").forEach(x => x.classList.remove("active"));
                el.classList.add("active");
                renderModalCode();
            };
        });
        renderModalCode();
        document.getElementById("codeModal").style.display = "flex";
    }

    function renderModalCode() {
        const f = modalFiles[modalActive];
        document.getElementById("codeModalCode").innerHTML = highlightSolidity(f ? f.content : "");
    }

    function closeCodeModal() {
        document.getElementById("codeModal").style.display = "none";
    }

    // highlightSolidity 轻量 Solidity 语法高亮（注释/字符串/数字/关键字），参照 CodeViewer 的深色主题
    const SOLIDITY_KEYWORDS = new Set([
        "pragma", "solidity", "import", "contract", "interface", "library", "function", "modifier",
        "event", "struct", "enum", "mapping", "address", "bool", "string", "bytes", "byte",
        "uint", "uint8", "uint16", "uint32", "uint64", "uint128", "uint256",
        "int", "int8", "int16", "int32", "int64", "int128", "int256",
        "bytes1", "bytes2", "bytes4", "bytes8", "bytes16", "bytes32",
        "memory", "storage", "calldata", "public", "private", "external", "internal",
        "payable", "view", "pure", "returns", "return", "require", "revert", "emit",
        "new", "if", "else", "for", "while", "do", "break", "continue", "throw",
        "try", "catch", "assembly", "unchecked", "immutable", "constant", "constructor",
        "fallback", "receive", "is", "using", "override", "virtual", "indexed", "anonymous",
        "delete", "this", "super", "msg", "tx", "block", "abi", "type", "true", "false",
        "wei", "ether", "gwei", "days", "hours", "minutes", "seconds"
    ]);

    function highlightSolidity(src) {
        const code = String(src || "");
        const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(0x[0-9a-fA-F]+|\b\d+(?:\.[\d_]+)?\b)|([A-Za-z_$][\w$]*)/g;
        let out = "";
        let last = 0;
        let m;
        while ((m = re.exec(code)) !== null) {
            out += esc(code.slice(last, m.index));
            if (m[1]) out += `<span class="tok-com">${esc(m[1])}</span>`;
            else if (m[2]) out += `<span class="tok-str">${esc(m[2])}</span>`;
            else if (m[3]) out += `<span class="tok-num">${esc(m[3])}</span>`;
            else if (m[4]) {
                out += SOLIDITY_KEYWORDS.has(m[4])
                    ? `<span class="tok-kw">${esc(m[4])}</span>` : esc(m[4]);
            }
            last = re.lastIndex;
        }
        return out + esc(code.slice(last));
    }

    // 弹窗交互绑定（脚本位于 body 末尾，元素已存在）
    document.getElementById("codeCloseBtn").onclick = closeCodeModal;
    document.getElementById("codeCopyBtn").onclick = async () => {
        const f = modalFiles[modalActive];
        if (!f) return;
        try { await navigator.clipboard.writeText(f.content); } catch (e) { /* 忽略复制失败 */ }
    };
    document.getElementById("codeModal").addEventListener("click", e => {
        if (e.target && e.target.id === "codeModal") closeCodeModal();
    });
    document.addEventListener("keydown", e => {
        if (e.key === "Escape") closeCodeModal();
    });

    // 孤立 Sync 的渲染与入口见 solidary_sync.js（renderSolidary / runSolidary）

    // ===== 用户输入调用分析逻辑见 user_input_taint.js =====

    function renderMeta(c) {
        const parts = [];
        parts.push(`<span class="kv"><b>#${c.id}</b></span>`);
        parts.push(`<span class="kv">src <b>${esc(c.source || "")}</b></span>`);
        parts.push(`<span class="kv">${esc(c.method || "")} <b>${esc(c.url || "")}</b></span>`);
        parts.push(`<span class="kv">status <b>${c.status}</b></span>`);
        if (c.mimeType) parts.push(`<span class="kv">mime <b>${esc(c.mimeType)}</b></span>`);
        if (c.pageUrl) parts.push(`<span class="kv">page <b>${esc(c.pageUrl)}</b></span>`);
        if (c.capturedAt) parts.push(`<span class="kv">captured <b>${esc(c.capturedAt)}</b></span>`);
        if (c.receivedAt) parts.push(`<span class="kv">received <b>${esc(c.receivedAt)}</b></span>`);
        if (c.truncated) parts.push(`<span class="kv" style="color:#e6a23c;">已截断</span>`);
        if (c.responseEncoding) parts.push(`<span class="kv">enc <b>${esc(c.responseEncoding)}</b></span>`);
        return parts.join("");
    }

    // 从 page 参数（BlockSec 交易页 URL）中解析 txHash
    function parseTxHashFromPage(pageUrl) {
        const s = String(pageUrl || "");
        try {
            for (const seg of new URL(s).pathname.split("/")) {
                if (/^0x[0-9a-fA-F]{64}$/.test(seg)) return seg.toLowerCase();
            }
        } catch (e) { /* 非标准 URL，退回正则 */ }
        const m = s.match(/0x[0-9a-fA-F]{64}/);
        return m ? m[0].toLowerCase() : "";
    }

    // 取某条 capture 请求体里的 txnHash
    async function fetchTxnHash(captureId) {
        try {
            const resp = await fetch(`${API_LIST}?id=${encodeURIComponent(captureId)}`);
            const d = await resp.json();
            const cc = (d.captures || [])[0];
            return cc ? (parsePayload(cc.requestBody).txnHash || "") : "";
        } catch (e) {
            return "";
        }
    }

    // page 模式：每秒轮询后端，trace 与 address-label 都到齐后按该 txHash 渲染
    async function watchPage(pageUrl) {
        const statusEl = document.getElementById("status");
        const txHash = parseTxHashFromPage(pageUrl);
        if (!txHash) {
            statusEl.className = "status error";
            statusEl.style.display = "block";
            statusEl.textContent = "page 参数中未解析到 txHash：" + pageUrl;
            return;
        }
        const started = Date.now();
        const hashCache = new Map(); // captureId -> txnHash，避免每秒重复取详情
        for (;;) {
            let traceId = null;
            let labelId = null;
            try {
                const resp = await fetch(API_LIST);
                const data = await resp.json();
                if (resp.ok) {
                    for (const c of (data.captures || [])) {
                        if (!isTraceUrl(c.url) && !isLabelUrl(c.url)) continue;
                        let h = hashCache.get(c.id);
                        if (h === undefined) {
                            h = await fetchTxnHash(c.id);
                            if (h) hashCache.set(c.id, h); // 取失败不缓存，下一轮再试
                        }
                        if (!h || h.toLowerCase() !== txHash) continue;
                        if (isTraceUrl(c.url)) traceId = c.id;
                        else labelId = c.id;
                    }
                }
            } catch (e) { /* 后端暂不可达，继续轮询 */ }
            if (traceId && labelId) { // 两者齐备才渲染
                await refreshList(traceId);
                return;
            }
            const secs = Math.round((Date.now() - started) / 1000);
            statusEl.className = "status";
            statusEl.style.display = "block";
            statusEl.textContent =
                `等待后端捕获 ${txHash.slice(0, 10)}…：trace ${traceId ? "✓" : "…"} / address-label ${labelId ? "✓" : "…"}，已等待 ${secs}s`;
            await new Promise(r => setTimeout(r, 1000));
        }
    }

    async function refreshList(preferId) {
        const sel = document.getElementById("capSelect");
        const btn = document.getElementById("refreshBtn");
        const statusEl = document.getElementById("status");
        const metaEl = document.getElementById("meta");
        const traceEl = document.getElementById("traceView");
        btn.disabled = true;
        statusEl.className = "status";
        statusEl.textContent = "加载 capture 列表中...";
        statusEl.style.display = "block";
        metaEl.style.display = "none";
        traceEl.style.display = "none";
        try {
            const resp = await fetch(API_LIST);
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
            const list = data.captures || [];
            if (!list.length) {
                sel.innerHTML = "";
                statusEl.textContent = "暂无 capture 数据（扩展尚未上报任何捕获）";
                return;
            }
            // 列表按 id 升序返回，最新在最后；下拉按最新优先展示
            const ordered = list.slice().reverse();
            // 缓存到全局，供 loadCapture 找 address-label 关联用
            window.gCaptures = ordered.map(c => ({ id: c.id, url: c.url, method: c.method, status: c.status }));
            sel.innerHTML = ordered.map(c => {
                const tag = isTraceUrl(c.url) ? "[trace] " : "";
                const label = `${tag}#${c.id} · ${c.method || "?"} ${shortUrl(c.url)} · ${c.status}`;
                return `<option value="${c.id}">${esc(label)}</option>`;
            }).join("");
            // 指定了 preferId（page 参数轮询命中）则选它，否则默认选最新（ordered[0] 即最大 id）
            const chosen = (preferId != null && ordered.some(c => String(c.id) === String(preferId)))
                ? String(preferId) : String(ordered[0].id);
            sel.value = chosen;
            await loadCapture();
            // 异步补 txnHash 到 trace 类 option（需逐条详情取 requestBody，不阻塞主流程）
            const traceCaps = ordered.filter(c => isTraceUrl(c.url));
            if (traceCaps.length) {
                Promise.all(traceCaps.map(c =>
                    fetch(`${API_LIST}?id=${c.id}`).then(r => r.json()).then(d => {
                        const cc = (d.captures || [])[0];
                        const p = cc ? parsePayload(cc.requestBody) : {};
                        return { id: c.id, txnHash: p.txnHash || "" };
                    }).catch(() => ({ id: c.id, txnHash: "" }))
                )).then(arr => {
                    arr.forEach(x => {
                        if (!x.txnHash) return;
                        const opt = sel.querySelector(`option[value="${x.id}"]`);
                        const cap = traceCaps.find(c => c.id === x.id);
                        if (opt && cap) opt.textContent = `[trace] ${shortHash(x.txnHash)} #${cap.id} · ${cap.method || "?"} ${shortUrl(cap.url)} · ${cap.status}`;
                    });
                    // 部分浏览器对 selected option 文本更新不实时刷新，重设 value 触发刷新
                    sel.value = chosen;
                });
            }
        } catch (err) {
            statusEl.className = "status error";
            statusEl.textContent = "加载列表失败：" + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    function shortUrl(u) {
        if (!u) return "";
        try {
            const url = new URL(u);
            return url.pathname + (url.search ? url.search.slice(0, 20) : "");
        } catch (e) {
            return u.length > 50 ? u.slice(0, 50) + "…" : u;
        }
    }

    function shortHash(h) {
        if (!h) return "";
        return h.length > 12 ? h.slice(0, 8) + "…" + h.slice(-4) : h;
    }

    // 判断 capture URL 是否以某后缀结尾（取 pathname 比对，忽略 query）
    const TRACE_SUFFIX = "/api/explorer/v2/onchain/tx/trace";
    const LABEL_SUFFIX = "/api/explorer/v2/onchain/tx/address-label";
    function urlEndsWith(u, suffix) {
        if (!u) return false;
        try { return new URL(u).pathname.endsWith(suffix); }
        catch (e) { return String(u).endsWith(suffix); }
    }
    function isTraceUrl(u) { return urlEndsWith(u, TRACE_SUFFIX); }
    function isLabelUrl(u) { return urlEndsWith(u, LABEL_SUFFIX); }

    // 解析 capture 请求体 payload（JSON）。请求体字段 requestBody 无编码（直接 text），enc 可选
    function parsePayload(reqBody, enc) {
        const raw = decodeBody(reqBody, enc);
        if (!raw) return {};
        try { return JSON.parse(raw) || {}; } catch (e) { return {}; }
    }

    async function loadCapture() {
        const sel = document.getElementById("capSelect");
        const id = sel.value;
        if (!id) return;
        const statusEl = document.getElementById("status");
        const metaEl = document.getElementById("meta");
        const traceEl = document.getElementById("traceView");
        const panelEl = document.getElementById("solidaryPanel");
        const taintPanelEl = document.getElementById("taintPanel");
        const btn = document.getElementById("reloadBtn");
        btn.disabled = true;
        window.gCurrent = null;
        panelEl.style.display = "none";
        panelEl.innerHTML = "";
        taintPanelEl.style.display = "none";
        taintPanelEl.innerHTML = "";
        statusEl.className = "status";
        statusEl.textContent = "加载 capture 详情中...";
        statusEl.style.display = "block";
        metaEl.style.display = "none";
        traceEl.style.display = "none";
        try {
            const resp = await fetch(`${API_LIST}?id=${encodeURIComponent(id)}`);
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
            const caps = data.captures || [];
            const c = caps[0];
            if (!c) {
                statusEl.textContent = "未找到该 capture";
                return;
            }
            metaEl.innerHTML = renderMeta(c);
            metaEl.style.display = "block";

            // 仅 URL 以 /tx/trace 结尾的 capture 才做 trace 解析；其他只显示 meta，不渲染
            if (!isTraceUrl(c.url)) {
                statusEl.textContent = "非 trace 数据（URL 不以 /tx/trace 结尾），不渲染 trace。";
                return;
            }

            // 解析请求体 payload → chainId / txnHash（请求体字段为 requestBody，无编码，直接 text）
            const payload = parsePayload(c.requestBody);
            const chainId = payload.chainId;
            const txnHash = payload.txnHash || "";

            // chainId 同步到链下拉框（真实 id，如 56=bsc）
            const chainSel = document.getElementById("chainId");
            if (chainId !== undefined && chainId !== null) {
                const cidStr = String(chainId);
                if (![...chainSel.options].some(o => o.value === cidStr)) {
                    chainSel.insertAdjacentHTML("beforeend", `<option value="${esc(cidStr)}">${esc(cidStr)} · 未知链</option>`);
                }
                chainSel.value = cidStr;
            }

            // 找 address-label capture（payload.txnHash 与 trace 相同）→ 取 labels
            let labels = [];
            if (txnHash && Array.isArray(window.gCaptures)) {
                const labelIds = window.gCaptures.filter(x => isLabelUrl(x.url)).map(x => x.id);
                if (labelIds.length) {
                    const results = await Promise.all(labelIds.map(lid =>
                        fetch(`${API_LIST}?id=${encodeURIComponent(lid)}`).then(r => r.json()).catch(() => ({ captures: [] }))
                    ));
                    for (const r of results) {
                        const cc = (r.captures || [])[0];
                        if (!cc) continue;
                        const p = parsePayload(cc.requestBody);
                        if (p.txnHash === txnHash) {
                            const respB = decodeBody(cc.responseBody, cc.responseEncoding);
                            try {
                                const obj = JSON.parse(respB || "{}");
                                if (Array.isArray(obj.labels)) { labels = obj.labels; break; }
                            } catch (e) {}
                        }
                    }
                }
            }

            const body = decodeBody(c.responseBody, c.responseEncoding);
            if (!body) {
                statusEl.textContent = "该 capture 响应体为空";
                return;
            }
            let html = "";
            if (c.truncated) {
                html += `<div class="truncated-warn">⚠ 响应体被扩展截断，可能无法完整解析</div>`;
            }
            if (txnHash) {
                html += `<div class="hint" style="margin-bottom:8px;">txnHash: <b style="word-break:break-all;">${esc(txnHash)}</b> · chainId <b>${esc(chainId !== undefined ? chainId : "")}</b> · labels <b>${labels.length}</b> 条</div>`;
            }
            html += renderTrace(body, labels);
            traceEl.innerHTML = html;
            traceEl.style.display = "block";
            statusEl.style.display = "none";

            // 缓存当前 trace 与 labelMap，供“查找孤立 Sync”使用
            const parsedTrace = tryParseTrace(body);
            const labelMap = new Map();
            (labels || []).forEach(l => { if (l && l.address) labelMap.set(String(l.address).toLowerCase(), l.label || ""); });
            window.gCurrent = { trace: parsedTrace, labelMap };
        } catch (err) {
            statusEl.className = "status error";
            statusEl.textContent = "加载失败：" + err.message;
        } finally {
            btn.disabled = false;
        }
    }

    // 首次自动加载：带 page 参数时按 txHash 每秒轮询，齐备后渲染；否则保持原行为
    const pageParam = new URLSearchParams(location.search).get("page");
    if (pageParam) watchPage(pageParam);
    else refreshList();
</script>
</body>
</html>
